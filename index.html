<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Family Fun 2.6.0 — بازی سه‌بعدی زندگی خانوادگی و شهر باز، فارسی و راست‌چین">
<meta name="theme-color" content="#0f0f1e">
<title>Family Fun 2.6.0 — Open City Edition</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap');

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:'Vazirmatn',sans-serif;background:#000;touch-action:none;user-select:none;}

/* START */
#start-screen{
  position:absolute;inset:0;z-index:500;
  background:linear-gradient(160deg,rgba(26,10,46,.88),rgba(22,33,62,.88) 40%,rgba(15,52,96,.88) 80%,rgba(83,52,131,.88)),url('textures/menu-bg.jpg') center/cover no-repeat;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;transition:opacity .8s;
}
.start-logo{font-size:clamp(36px,10vw,64px);font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ff8c42,#ff4e88);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;margin-bottom:4px;filter:drop-shadow(0 0 30px rgba(255,140,66,.5));
  animation:logoGlow 3s ease-in-out infinite alternate;}
@keyframes logoGlow{from{filter:drop-shadow(0 0 20px rgba(255,140,66,.4))}to{filter:drop-shadow(0 0 50px rgba(255,78,136,.7))}}
.start-sub{font-size:13px;opacity:.5;letter-spacing:3px;margin-bottom:40px;}
.start-form{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:20px;padding:30px 36px;width:min(90vw,360px);backdrop-filter:blur(20px);
  display:flex;flex-direction:column;gap:14px;}
.start-form label{font-size:12px;opacity:.6;}
.start-form input{padding:13px 16px;font-size:16px;font-family:'Vazirmatn',sans-serif;
  border-radius:11px;border:1.5px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);color:#fff;text-align:right;outline:none;transition:border-color .2s;}
.start-form input:focus{border-color:#ffd700;}
.start-form input::placeholder{color:rgba(255,255,255,.3);}
.gender-row{display:flex;gap:10px;}
.gbtn{flex:1;padding:11px;border-radius:10px;border:1.5px solid rgba(255,255,255,.15);
  background:transparent;color:rgba(255,255,255,.55);font-family:'Vazirmatn',sans-serif;
  font-size:13px;cursor:pointer;transition:all .2s;}
.gbtn.active{background:rgba(255,215,0,.15);border-color:#ffd700;color:#ffd700;}
.play-btn{padding:15px;font-size:16px;font-weight:700;font-family:'Vazirmatn',sans-serif;
  border:none;border-radius:13px;cursor:pointer;
  background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a0a2e;
  box-shadow:0 6px 30px rgba(255,140,66,.4);transition:transform .15s;}
.play-btn:active{transform:scale(.97);}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:10;}

/* Stats bar */
#stats-bar{position:absolute;top:0;left:0;right:0;padding:10px 14px 8px;
  background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);
  display:flex;align-items:center;gap:10px;pointer-events:none;}
.hud-avatar{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#ffd700,#ff8c42);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  border:2px solid rgba(255,255,255,.25);flex-shrink:0;}
.hud-info{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.hud-name{font-size:13px;font-weight:700;color:#fff;}
.hud-level{font-size:10px;color:#ffd700;}
.sdiv{width:1px;height:34px;background:rgba(255,255,255,.15);flex-shrink:0;}
.si{display:flex;flex-direction:column;gap:2px;min-width:52px;}
.si-label{font-size:9px;color:rgba(255,255,255,.5);}
.si-bg{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;width:52px;}
.si-fill{height:100%;border-radius:2px;transition:width .5s;}
.si-fill.health{background:linear-gradient(90deg,#ff4444,#ff8c42);}
.si-fill.energy{background:linear-gradient(90deg,#4488ff,#44aaff);}
.si-fill.hunger{background:linear-gradient(90deg,#44cc44,#aaff44);}
.si-fill.happy{background:linear-gradient(90deg,#ffaa44,#ffd700);}
.si-fill.social{background:linear-gradient(90deg,#cc44ff,#ff44cc);}
.si-fill.money{background:linear-gradient(90deg,#44ffaa,#00e676);}

/* Time */
#time-widget{position:absolute;top:10px;right:14px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);
  border-radius:11px;padding:7px 13px;backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
#time-disp{font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;}
#day-disp{font-size:10px;color:rgba(255,255,255,.45);}

/* Minimap */
#minimap{position:absolute;top:90px;left:12px;
  width:110px;height:110px;border-radius:50%;
  background:rgba(10,15,25,.75);border:2px solid rgba(255,255,255,.2);
  overflow:hidden;pointer-events:none;}
#minimap canvas{width:100%;height:100%;}
#minimap-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:9px;color:rgba(255,255,255,.4);white-space:nowrap;}

/* Joystick */
#joystick-zone{position:absolute;bottom:40px;left:34px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);
  backdrop-filter:blur(6px);pointer-events:auto;}
#joystick-knob{position:absolute;top:50%;left:50%;width:48px;height:48px;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.55));
  border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 4px 15px rgba(0,0,0,.35);}

/* Action buttons right */
#action-btns{position:absolute;bottom:40px;right:20px;
  display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
.acircle{width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;transition:all .15s;}
.acircle:active{transform:scale(.88);background:rgba(255,255,255,.15);}

/* Interact button */
#interact-btn{position:absolute;bottom:172px;left:50%;transform:translateX(-50%);
  pointer-events:auto;padding:11px 28px;border-radius:28px;border:none;
  background:linear-gradient(135deg,#00e676,#00bcd4);
  color:#000;font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:14px;
  cursor:pointer;display:none;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,230,118,.55);
  animation:ipulse 1s ease-in-out infinite alternate;}
@keyframes ipulse{from{box-shadow:0 4px 20px rgba(0,230,118,.4);transform:translateX(-50%) scale(1)}
  to{box-shadow:0 4px 35px rgba(0,230,118,.8);transform:translateX(-50%) scale(1.04)}}

/* Toast */
#toast-area{position:absolute;top:72px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;
  z-index:50;width:min(90vw,340px);}
.toast{background:rgba(12,12,22,.92);border:1px solid rgba(255,255,255,.1);
  color:#fff;padding:9px 18px;border-radius:28px;font-size:13px;
  backdrop-filter:blur(12px);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:100%;text-align:center;}
@keyframes toastIn{from{opacity:0;transform:scale(.7) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* Dialog */
#dialog-box{position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(5,5,20,.97),rgba(5,5,20,.85) 75%,transparent);
  padding:20px 18px 26px;pointer-events:auto;display:none;min-height:170px;z-index:30;}
#dialog-portrait{width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  border:2px solid rgba(255,255,255,.2);margin-bottom:8px;
  background:rgba(255,255,255,.08);}
#dialog-npc{font-size:12px;font-weight:700;color:#ffd700;margin-bottom:6px;letter-spacing:.5px;}
#dialog-text{font-size:15px;line-height:1.7;color:rgba(255,255,255,.9);margin-bottom:14px;}
#dialog-choices{display:flex;flex-direction:column;gap:7px;}
.dchoice{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-family:'Vazirmatn',sans-serif;font-size:13px;
  padding:9px 14px;border-radius:9px;text-align:right;cursor:pointer;transition:all .15s;}
.dchoice:active{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.3);color:#ffd700;}
#dialog-skip{position:absolute;top:14px;left:16px;font-size:11px;
  color:rgba(255,255,255,.3);cursor:pointer;pointer-events:auto;}

/* Phone UI */
#phone-overlay{position:absolute;inset:0;z-index:200;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;}
#phone-ui{width:min(86vw,320px);height:min(88vh,560px);
  background:linear-gradient(180deg,#1a1a2e,#16213e);
  border-radius:36px;border:3px solid rgba(255,255,255,.15);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.8);}
#phone-header{padding:18px 20px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.08);}
#phone-title{font-size:16px;font-weight:700;color:#fff;flex:1;}
#phone-close{width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.1);border:none;color:#fff;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#phone-contacts{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
#phone-contacts::-webkit-scrollbar{width:3px;}
#phone-contacts::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
.pcontact{display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:12px;cursor:pointer;transition:background .15s;
  border:1px solid rgba(255,255,255,.06);}
.pcontact:active{background:rgba(255,255,255,.1);}
.pc-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;}
.pc-info{flex:1;}
.pc-name{font-size:13px;font-weight:600;color:#fff;}
.pc-role{font-size:11px;color:rgba(255,255,255,.4);}
.pc-action{font-size:10px;color:#00e676;margin-top:2px;}

/* Call screen */
#call-screen{position:absolute;inset:0;z-index:250;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);backdrop-filter:blur(8px);}
#call-ui{width:min(86vw,300px);background:linear-gradient(180deg,#1a1a2e,#0f3460);
  border-radius:28px;padding:30px 20px;text-align:center;
  border:2px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.8);}
#call-avatar{font-size:56px;margin-bottom:12px;animation:callPulse 1.5s ease-in-out infinite;}
@keyframes callPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#call-name{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px;}
#call-status{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:24px;}
#call-response{font-size:14px;color:rgba(255,255,255,.85);
  background:rgba(255,255,255,.07);border-radius:12px;padding:12px 16px;
  margin-bottom:20px;line-height:1.6;min-height:50px;text-align:right;}
.call-btn-row{display:flex;gap:12px;justify-content:center;}
.call-btn{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .15s;}
.call-btn:active{transform:scale(.88);}
.call-btn.end{background:#ff4444;}
.call-btn.accept{background:#00cc66;}

/* Event banner */
#event-banner{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:60;display:none;}
#eb-text{font-size:clamp(22px,7vw,44px);font-weight:900;
  background:linear-gradient(135deg,#ffd700,#ff8c42);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,140,66,.6));
  animation:bannerPop .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes bannerPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* Name tags */
.name-tag{position:absolute;pointer-events:none;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:1px;}
.nt-name{background:rgba(8,8,18,.82);color:#fff;padding:2px 8px;
  border-radius:5px;font-size:11px;font-weight:600;
  border:1px solid rgba(255,255,255,.15);white-space:nowrap;}
.name-tag.player .nt-name{color:#ffd700;border-color:rgba(255,215,0,.4);}

/* Fade */
#fade{position:absolute;inset:0;background:#000;opacity:0;
  pointer-events:none;z-index:400;transition:opacity 1s;}

/* Location sign */
#location-sign{position:absolute;top:68px;right:14px;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:5px 12px;backdrop-filter:blur(8px);
  font-size:11px;color:rgba(255,255,255,.65);pointer-events:none;display:none;}

/* Sprint */
#sprint-btn{position:absolute;bottom:172px;right:86px;pointer-events:auto;
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,140,66,.15);border:2px solid rgba(255,140,66,.3);
  display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
#sprint-btn.on{background:rgba(255,140,66,.45);border-color:#ff8c42;}

/* Family Fun visual polish layer */
.enhanced-badge{position:fixed;bottom:14px;left:14px;z-index:20;background:rgba(16,24,40,.72);border:1px solid rgba(255,215,120,.28);border-radius:999px;padding:7px 12px;color:#ffe6a3;font-size:11px;backdrop-filter:blur(8px);pointer-events:none}

</style>
</head>
<body>


<!-- START -->
<div id="start-screen">
  <img src="textures/logo.png" alt="Family Fun" style="width:min(86vw,420px);height:auto;margin-bottom:10px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.35));">
  <div class="start-logo">🏘️ خانه ما</div>
  <div class="start-sub">شهر کوچک ما — نسخه‌ی جهان‌باز</div>
  <div class="start-form">
    <label>اسمت چیه؟</label>
    <input type="text" id="username" placeholder="مثلاً علیرضا یا سبا" maxlength="14">
    <label>جنسیت</label>
    <div class="gender-row">
      <button class="gbtn active" id="gbM" onclick="setGender('male')">👦 پسر</button>
      <button class="gbtn" id="gbF" onclick="setGender('female')">👧 دختر</button>
    </div>
    <label style="font-size:12px;opacity:.6">کیفیت گرافیک</label>
    <select id="quality-select" style="padding:11px 14px;border-radius:11px;background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.15);font-family:'Vazirmatn',sans-serif">
      <option value="low">سبک (گوشی ضعیف)</option>
      <option value="balanced">متعادل (پیش‌فرض موبایل)</option>
      <option value="high">بالا (دسکتاپ)</option>
    </select>
    <button class="play-btn" onclick="initGame()">ورود به شهر ←</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="stats-bar">
    <div class="hud-avatar" id="hud-av">😊</div>
    <div class="hud-info">
      <div class="hud-name" id="hud-name">—</div>
      <div class="hud-level" id="hud-lv">⭐ سطح ۱</div>
    </div>
    <div class="sdiv"></div>
    <div class="si"><div class="si-label">❤️ سلامت</div><div class="si-bg"><div class="si-fill health" id="b-health" style="width:100%"></div></div></div>
    <div class="si"><div class="si-label">⚡ انرژی</div><div class="si-bg"><div class="si-fill energy" id="b-energy" style="width:80%"></div></div></div>
    <div class="si"><div class="si-label">🍽 سیری</div><div class="si-bg"><div class="si-fill hunger" id="b-hunger" style="width:70%"></div></div></div>
    <div class="si"><div class="si-label">😄 شادی</div><div class="si-bg"><div class="si-fill happy" id="b-happy" style="width:85%"></div></div></div>
    <div class="si"><div class="si-label">💰 پول</div><div class="si-bg"><div class="si-fill money" id="b-money" style="width:40%"></div></div></div>
  </div>
  <div id="time-widget">
    <div id="time-disp">۰۸:۰۰</div>
    <div id="day-disp">روز ۱</div>
  </div>
  <!-- Minimap -->
  <div id="minimap"><canvas id="mm-canvas" width="110" height="110"></canvas></div>
  <div id="minimap-label">نقشه</div>
  <!-- Joystick -->
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <!-- Sprint -->
  <div id="sprint-btn" ontouchstart="setSprint(true)" ontouchend="setSprint(false)">🏃</div>
  <!-- Interact -->
  <button id="interact-btn" onclick="triggerInteract()">اکشن</button>
  <!-- Right buttons -->
  <div id="action-btns">
    <div class="acircle" onclick="openPhone()">📱</div>
    <div class="acircle" onclick="openInventory()">🎒</div>
    <div class="acircle" id="cam-toggle-btn" onclick="toggleCameraMode()">🎥</div>
  </div>
  <!-- Toast -->
  <div id="toast-area"></div>
  <!-- Location -->
  <div id="location-sign">📍 خیابان</div>
  <!-- Dialog -->
  <div id="dialog-box">
    <div id="dialog-skip" onclick="closeDialog()">← رد کن</div>
    <div id="dialog-portrait"></div>
    <div id="dialog-npc"></div>
    <div id="dialog-text"></div>
    <div id="dialog-choices"></div>
  </div>
  <!-- Event banner -->
  <div id="event-banner"><div id="eb-text"></div></div>
</div>

<!-- Phone -->
<div id="phone-overlay" onclick="closePhone(event)">
  <div id="phone-ui">
    <div id="phone-header">
      <div id="phone-title">📱 مخاطبین</div>
      <button id="phone-close" onclick="closePhone()">✕</button>
    </div>
    <div id="phone-contacts"></div>
  </div>
</div>

<!-- Call screen -->
<div id="call-screen">
  <div id="call-ui">
    <div id="call-avatar">😊</div>
    <div id="call-name">—</div>
    <div id="call-status">در حال اتصال...</div>
    <div id="call-response"></div>
    <div class="call-btn-row">
      <div class="call-btn end" onclick="endCall()">📵</div>
    </div>
  </div>
</div>

<!-- Fade -->
<div id="fade"></div>

<!-- Loading screen shown while Three.js loads -->
<div id="loading-screen" style="position:fixed;inset:0;z-index:9999;background:#0f0f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'Vazirmatn',sans-serif;">
  <div style="font-size:48px;margin-bottom:16px;animation:spin 2s linear infinite">⚙️</div>
  <div style="font-size:18px;font-weight:700;margin-bottom:8px;">در حال بارگذاری...</div>
  <div id="load-status" style="font-size:13px;opacity:.5;">لطفاً صبر کنید</div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</div>



<script>
(function(){
  setTimeout(function(){
    if (window.FFBootDone || window.FFBootFailed) return;
    var loading = document.getElementById('loading-screen');
    if (!loading || loading.style.display === 'none') return;
    var st = document.getElementById('load-status');
    if (st) { st.textContent = 'بارگذاری بیش از حد طول کشید — احتمالاً نسخه قدیمی سایت کش شده است. روی تلاش مجدد بزن.'; st.style.color = '#ff8888'; }
    if (!document.getElementById('ff-fallback-retry')) {
      var b = document.createElement('button');
      b.id = 'ff-fallback-retry';
      b.textContent = '🔄 تلاش مجدد';
      b.style.cssText = 'margin-top:16px;padding:12px 28px;border:none;border-radius:12px;background:#ffd700;color:#1a0a2e;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer';
      b.onclick = function(){ location.reload(); };
      loading.appendChild(b);
    }
  }, 25000);
})();
</script>

<script type="module" src="/src/main.js"></script>
</body>
</html>
